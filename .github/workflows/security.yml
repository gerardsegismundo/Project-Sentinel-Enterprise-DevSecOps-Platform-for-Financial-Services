name: Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: trufflesecurity/truffleHog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit p/secrets p/owasp-top-ten

  sast-sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: SonarSource/sonarqube-scan-action@v2
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-scan:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./app/package-lock.json

      - run: npm ci

      - name: Snyk scan
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npx snyk test --severity-threshold=high

      - name: npm audit fallback
        if: ${{ env.SNYK_TOKEN == '' }}
        run: npm audit --audit-level=high || true

  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive terraform/

      - run: terraform -chdir=terraform/environments/dev init -backend=false
      - run: terraform -chdir=terraform/environments/dev validate

      - run: terraform -chdir=terraform/environments/staging init -backend=false
      - run: terraform -chdir=terraform/environments/staging validate

      - run: terraform -chdir=terraform/environments/production init -backend=false
      - run: terraform -chdir=terraform/environments/production validate

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform

      - uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform/
          soft_fail: true

  container-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t trading-simulator:${{ github.sha }} ./app

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan with Grype
        run: grype trading-simulator:${{ github.sha }} --fail-on critical || true

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: trading-simulator:${{ github.sha }}
          severity: CRITICAL,HIGH